<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speed Typer</title>
    <link rel="stylesheet" href="./css.css">
</head>
<body>

    <div class="pettiya-kudu">
        <h2 class="amoo-title">Test Your Typing Speed</h2>
        
        <div class="row-of-stats">
            <div class="little-square">WPM: <span id="wpm">0</span></div>
            <div class="little-square">Accuracy: <span id="accuracy">100</span>%</div>
            <div class="little-square">Time: <span id="timer">60</span>s</div>
            <div class="little-square">Mistakes: <span id="mistakes">0</span></div>
        </div>

        <div class="aneAyyeEkaDigaine" id="text-display"></div>

        <textarea id="text-input" autofocus placeholder="Click here and start typing..."></textarea>

        <button id="restart-btn" class="green-clicky-button">Restart Test</button>
    </div>
    <script src="./js.js"></script>
</body>
</html>
